name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin and skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate SKILL.md frontmatter
        run: |
          for f in $(find . -path ./.git -prune -o -name SKILL.md -print); do
            head -1 "$f" | grep -q '^---$' || { echo "::error file=$f::missing YAML frontmatter"; exit 1; }
            grep -q '^name:' "$f" || { echo "::error file=$f::missing 'name' in frontmatter"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error file=$f::missing 'description' in frontmatter"; exit 1; }
            echo "OK: $f"
          done

      - name: Check .skill bundles match their skill folders
        run: |
          for b in $(find plugins -name '*.skill'); do
            n=$(basename "$b" .skill); tmp=$(mktemp -d)
            unzip -q "$b" -d "$tmp"
            diff -r "$tmp/$n" "$(dirname "$b")/skills/$n" || { echo "::error file=$b::out of date with skills/$n"; exit 1; }
            echo "OK: $b"
          done

      # Unpinned deliberately: this needs to validate against whatever Claude Code
      # version installers actually get, not a version pinned the day this workflow
      # was written. `claude --version` below records what actually ran.
      - name: Install Claude Code CLI
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .
          for d in plugins/*/; do claude plugin validate "$d"; done
