name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin and skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate SKILL.md frontmatter
        shell: python
        run: |
          import pathlib, sys
          failed = False
          for f in sorted(pathlib.Path("plugins").glob("*/skills/*/SKILL.md")):
              lines = f.read_text().splitlines()
              if not lines or lines[0] != "---" or "---" not in lines[1:]:
                  print(f"::error file={f}::missing YAML frontmatter"); failed = True; continue
              front = lines[1:lines.index("---", 1)]
              for key in ("name", "description"):
                  if not any(l.startswith(f"{key}:") and l[len(key) + 1:].strip() for l in front):
                      print(f"::error file={f}::missing '{key}' in frontmatter"); failed = True
              print(f"checked: {f}")
          sys.exit(failed)

      - name: Check marketplace lists every plugin, with no versions
        shell: python
        run: |
          import json, pathlib, sys
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          listed = {p["name"]: p for p in market["plugins"]}
          dirs = {d.name for d in pathlib.Path("plugins").iterdir() if d.is_dir()}
          failed = False
          for name in sorted(dirs - listed.keys()):
              print(f"::error file=plugins/{name}::not listed in marketplace.json"); failed = True
          for name, entry in sorted(listed.items()):
              if entry.get("source") != f"./plugins/{name}" or name not in dirs:
                  print(f"::error file=.claude-plugin/marketplace.json::{name}: source must be ./plugins/{name}"); failed = True
                  continue
              manifest = json.loads(pathlib.Path(f"plugins/{name}/.claude-plugin/plugin.json").read_text())
              if manifest.get("name") != name:
                  print(f"::error file=plugins/{name}/.claude-plugin/plugin.json::name is {manifest.get('name')!r}, expected {name!r}"); failed = True
              # Unversioned plugins update on every merge to main; a version pins users until someone bumps it.
              if "version" in entry:
                  print(f"::error file=.claude-plugin/marketplace.json::{name}: remove 'version'"); failed = True
              if "version" in manifest:
                  print(f"::error file=plugins/{name}/.claude-plugin/plugin.json::remove 'version'"); failed = True
              print(f"checked: {name}")
          sys.exit(failed)

      - name: Check .skill bundles match their skill folders
        run: |
          for b in $(find plugins -name '*.skill'); do
            n=$(basename "$b" .skill); tmp=$(mktemp -d)
            unzip -q "$b" -d "$tmp"
            diff -r "$tmp/$n" "$(dirname "$b")/skills/$n" || { echo "::error file=$b::out of date with skills/$n"; exit 1; }
            echo "OK: $b"
          done

      - name: Check shared references are identical across skills
        run: |
          for p in plugins/*/; do
            find "$p" -path '*/skills/*/references/*' -type f -exec basename {} \; | sort | uniq -d | while read -r n; do
              first=""
              for f in $(find "$p" -path "*/skills/*/references/$n"); do
                [ -z "$first" ] && first="$f" && continue
                cmp -s "$first" "$f" || { echo "::error file=$f::differs from $first"; exit 1; }
              done
              echo "OK: $p $n"
            done
          done

      # Unpinned deliberately: this needs to validate against whatever Claude Code
      # version installers actually get, not a version pinned the day this workflow
      # was written. `claude --version` below records what actually ran.
      - name: Install Claude Code CLI
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version

      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .
          for d in plugins/*/; do claude plugin validate "$d"; done
